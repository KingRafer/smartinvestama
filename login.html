<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Login — Smart AI</title>
  <meta name="description" content="Login ke dashboard member Smart AI. Pantau performa EA trading, equity, referral, dan komisi secara real-time."/>
  <meta name="robots" content="index, follow"/>
  <link rel="canonical" href="index.html"/>
  <meta name="theme-color" content="#050a12"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme=dark] {
      --bg: #040810; --bg-card: rgba(12, 18, 32, 0.82); --border: rgba(148, 163, 184, 0.14);
      --cyan: #2dd4bf; --teal: #14b8a6; --text: #f8fafc; --text-muted: #94a3b8; --text-dim: #64748b;
      --green: #34d399; --glow: rgba(45, 212, 191, 0.22); --shadow: 0 30px 60px -25px rgba(0, 0, 0, 0.7);
    }
    [data-theme=light] {
      --bg: #e8eef6; --bg-card: rgba(255, 255, 255, 0.9); --border: rgba(15, 23, 42, 0.08);
      --cyan: #0f766e; --teal: #0d9488; --text: #0f172a; --text-muted: #475569; --text-dim: #94a3b8;
      --green: #059669; --glow: rgba(13, 148, 136, 0.15); --shadow: 0 25px 50px -20px rgba(15, 23, 42, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
      position: relative; overflow-x: hidden;
    }
    body::before, body::after { content: ''; position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; }
    body::before { width: 420px; height: 420px; top: -80px; left: -60px; background: radial-gradient(circle, rgba(45, 212, 191, 0.18), transparent 70%); }
    body::after { width: 380px; height: 380px; bottom: -100px; right: -40px; background: radial-gradient(circle, rgba(99, 102, 241, 0.14), transparent 70%); }
    .auth-shell { width: 100%; max-width: 420px; position: relative; z-index: 1; animation: rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    .logo { text-align: center; font-size: 1.55rem; font-weight: 800; letter-spacing: -0.04em; margin-bottom: 1.6rem; text-decoration: none; color: var(--text); display: block; }
    .logo span { background: linear-gradient(135deg, var(--cyan), #5eead4); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .card { background: var(--bg-card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 22px; padding: 1.85rem 1.7rem 1.6rem; box-shadow: var(--shadow); position: relative; overflow: hidden; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(45, 212, 191, 0.45), transparent); }
    .card h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.25rem; text-align: center; }
    .card .sub { text-align: center; color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.4rem; }
    .demo-box { border: 1px solid rgba(45, 212, 191, 0.28); background: linear-gradient(135deg, rgba(45, 212, 191, 0.1), rgba(20, 184, 166, 0.04)); border-radius: 14px; padding: 0.95rem 1.05rem; margin-bottom: 1.3rem; }
    .demo-box .row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; font-size: 0.82rem; color: var(--text-muted); }
    .demo-badge { font-size: 0.62rem; font-weight: 800; letter-spacing: 0.06em; background: linear-gradient(135deg, var(--cyan), var(--teal)); color: #042f2e; padding: 0.2rem 0.5rem; border-radius: 6px; box-shadow: 0 4px 12px rgba(45, 212, 191, 0.25); }
    .btn-demo { margin-left: auto; border: 1px solid rgba(45, 212, 191, 0.45); background: rgba(45, 212, 191, 0.06); color: var(--cyan); font-weight: 700; font-size: 0.75rem; padding: 0.42rem 0.85rem; border-radius: 999px; cursor: pointer; font-family: inherit; transition: background 0.15s, transform 0.15s, box-shadow 0.15s; }
    .btn-demo:hover { background: rgba(45, 212, 191, 0.14); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(45, 212, 191, 0.15); }
    .creds { margin-top: 0.45rem; font-size: 0.72rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text-dim); letter-spacing: 0.02em; }
    .form-group { margin-bottom: 1.05rem; }
    .form-group label { display: block; font-size: 0.74rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.38rem; }
    .form-group input { width: 100%; background: rgba(255, 255, 255, 0.035); border: 1px solid rgba(255, 255, 255, 0.09); border-radius: 12px; padding: 0.78rem 1rem; color: var(--text); font-size: 15px; font-family: inherit; outline: none; min-height: 48px; transition: border-color 0.18s, box-shadow 0.18s, background 0.18s; }
    [data-theme=light] .form-group input { background: rgba(15, 23, 42, 0.03); border-color: rgba(15, 23, 42, 0.1); }
    .form-group input:hover { border-color: rgba(45, 212, 191, 0.25); }
    .form-group input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px var(--glow); background: rgba(45, 212, 191, 0.03); }
    .btn-primary { width: 100%; margin-top: 0.35rem; padding: 0.92rem; border: none; border-radius: 12px; font-weight: 700; font-size: 0.95rem; font-family: inherit; cursor: pointer; background: linear-gradient(135deg, #2dd4bf 0%, #14b8a6 50%, #0d9488 100%); color: #042f2e; min-height: 50px; box-shadow: 0 8px 24px rgba(45, 212, 191, 0.28); transition: transform 0.15s, box-shadow 0.15s, filter 0.15s; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(45, 212, 191, 0.35); filter: brightness(1.04); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.65; cursor: wait; transform: none; }
    .msg { display: none; margin-top: 0.9rem; padding: 0.7rem 0.95rem; border-radius: 10px; font-size: 0.82rem; }
    .msg.show { display: block; animation: rise 0.3s ease; }
    .msg.error { background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.25); color: #f87171; }
    .msg.success { background: rgba(52, 211, 153, 0.1); border: 1px solid rgba(52, 211, 153, 0.25); color: var(--green); }
    .foot { text-align: center; margin-top: 1.35rem; font-size: 0.82rem; color: var(--text-dim); }
    .foot a { color: var(--cyan); font-weight: 600; text-decoration: none; }
    .foot a:hover { text-decoration: underline; }
    .theme-btn { position: fixed; top: 1.1rem; right: 1.1rem; width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-card); backdrop-filter: blur(12px); color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; z-index: 10; transition: border-color 0.15s, color 0.15s; }
    .theme-btn:hover { border-color: var(--cyan); color: var(--cyan); }
    .back-link { display: inline-flex; align-items: center; gap: 0.35rem; color: var(--text-muted); text-decoration: none; font-size: 0.82rem; font-weight: 600; margin-bottom: 1.1rem; transition: color 0.15s; }
    .back-link:hover { color: var(--cyan); }
    .back-link svg { flex-shrink: 0; }
  </style>
</head>
<body>
  <button type="button" class="theme-btn" id="theme-toggle" aria-label="Tema" title="Ganti tema">◐</button>
  <div class="auth-shell">
    <a href="index.html" class="back-link">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Kembali ke Beranda
    </a>
    <a href="index.html" class="logo">SMART<span>AI</span></a>
    <div class="card">
      <h1>Login</h1>
      <p class="sub">Masuk ke dashboard member</p>
      <div class="demo-box">
        <div class="row">
          <span class="demo-badge">DEMO</span>
          <span>Akses dashboard tanpa daftar</span>
          <button type="button" class="btn-demo" id="btn-demo">Isi akun demo</button>
        </div>
        <div class="creds">demo@smartai.id &nbsp;/&nbsp; demo123</div>
      </div>
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email / Username</label>
          <input type="text" id="email" name="email" placeholder="demo@smartai.id" autocomplete="username" required/>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required/>
        </div>
        <button type="submit" class="btn-primary" id="btn-submit">Masuk ke Dashboard</button>
      </form>
      <div id="msg" class="msg"></div>
      <p class="foot">Belum punya akun? <a href="daftar.html">Sign Up</a></p>
    </div>
  </div>
  <script src="js/auth.js"></script>
  <script>
  (function () {
    var html = document.documentElement;
    var themeBtn = document.getElementById('theme-toggle');
    try {
      var saved = localStorage.getItem('smartai_theme') || localStorage.getItem('theme');
      if (saved) html.setAttribute('data-theme', saved);
    } catch (e) {}
    if (themeBtn) {
      themeBtn.addEventListener('click', function () {
        var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        try { localStorage.setItem('smartai_theme', next); localStorage.setItem('theme', next); } catch (e) {}
      });
    }
    var form = document.getElementById('login-form');
    var emailEl = document.getElementById('email');
    var passEl = document.getElementById('password');
    var msg = document.getElementById('msg');
    var btnDemo = document.getElementById('btn-demo');
    var btnSubmit = document.getElementById('btn-submit');
    if (btnDemo) {
      btnDemo.addEventListener('click', function () {
        emailEl.value = 'demo@smartai.id';
        passEl.value = 'demo123';
        btnDemo.textContent = 'Terisi \u2713';
        setTimeout(function () { btnDemo.textContent = 'Isi akun demo'; }, 1200);
      });
    }
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var email = (emailEl.value || '').trim();
      var pass = passEl.value || '';
      btnSubmit.disabled = true;
      var session = null;
      if (typeof loginWithCredentials === 'function') session = loginWithCredentials(email, pass);
      if (!session) {
        var em = email.toLowerCase();
        if ((em === 'demo@smartai.id' || em === 'demo@smartai.com') && pass === 'demo123') {
          session = { nama: 'Demo Member', email: 'demo@smartai.id', hp: '081234567890', referral: 'SMARTAI-REF', avatar: null };
          try { localStorage.setItem('smartai_user', JSON.stringify(session)); } catch (err) {}
        }
      }
      if (session) {
        msg.className = 'msg show success';
        msg.textContent = 'Login berhasil. Mengalihkan...';
        setTimeout(function () { location.href = 'member/dashboard.html'; }, 400);
      } else {
        btnSubmit.disabled = false;
        msg.className = 'msg show error';
        msg.textContent = 'Email atau password salah. Klik "Isi akun demo".';
      }
    });
  })();
  </script>
</body>
</html>
