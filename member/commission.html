<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#060b14"/>
<meta name="description" content="Pantau komisi referral dan pendapatan level Smart AI secara real-time."/>
<meta name="robots" content="noindex, nofollow"/>
<title>Commission — Smart AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/app.css?v=20261118r">
<style>
.comm-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:1.25rem;margin-top:1.25rem}
@media(max-width:960px){.comm-grid{grid-template-columns:1fr}}
.chart-card{background:var(--bg-card-solid);border:1px solid var(--border);border-radius:16px;padding:1.2rem 1.3rem}
.chart-card h3{font-size:1rem;font-weight:800;margin-bottom:.25rem}
.chart-card .sub{font-size:.78rem;color:var(--text-muted);margin-bottom:1.1rem;line-height:1.4}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.25rem}
@media(max-width:700px){.stat-row{grid-template-columns:1fr}}
.stat-box{background:var(--bg-card-solid);border:1px solid var(--border);border-radius:14px;padding:1.1rem 1.2rem}
.stat-box .label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);margin-bottom:.3rem}
.stat-box .value{font-size:1.4rem;font-weight:800}
.stat-box .value.up{color:var(--green)}
.level-list{list-style:none;padding:0;margin:0}
.level-list li{display:flex;justify-content:space-between;align-items:center;padding:.75rem 0;border-bottom:1px solid var(--border);font-size:.9rem}
.level-list li:last-child{border-bottom:none}
.level-list .lv{font-weight:700;color:var(--cyan)}
.page-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:240px;gap:.9rem;color:var(--text-muted)}
.page-loading .spin{width:36px;height:36px;border-radius:50%;border:3px solid rgba(45,212,191,.12);border-top-color:var(--cyan);animation:spin .65s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<script>try{var t=localStorage.getItem('smartai_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<script src="../js/auth.js?v=20261118r"></script>
<script src="../js/app.js?v=20261118r"></script>
<script>
const user = renderShell('commission');
if (user) {
  var root = document.getElementById('page-content');
  root.innerHTML = '<div class="page-loading"><div class="spin"></div><p>Memuat data komisi…</p></div>';
  // Demo / structure – real data can be wired to backend later
  setTimeout(function() {
    root.innerHTML =
      '<div class="page-header"><div><h1>Commission</h1><p>Ringkasan komisi referral kamu</p></div></div>' +
      '<div class="stat-row">' +
        '<div class="stat-box"><div class="label">Total Komisi</div><div class="value up">$0.00</div></div>' +
        '<div class="stat-box"><div class="label">Bulan Ini</div><div class="value up">$0.00</div></div>' +
        '<div class="stat-box"><div class="label">Downline</div><div class="value">0</div></div>' +
      '</div>' +
      '<div class="comm-grid">' +
        '<div class="chart-card"><h3>Komisi per Level</h3><p class="sub">Struktur multi-level Smart AI</p>' +
          '<ul class="level-list">' +
            '<li><span class="lv">Level 1</span><span>$0.00</span></li>' +
            '<li><span class="lv">Level 2</span><span>$0.00</span></li>' +
            '<li><span class="lv">Level 3</span><span>$0.00</span></li>' +
            '<li><span class="lv">Level 4+</span><span>$0.00</span></li>' +
          '</ul></div>' +
        '<div class="chart-card"><h3>Cara Kerja</h3><p class="sub">Komisi dihitung dari volume trading downline sesuai aturan package.</p>' +
          '<p style="font-size:.85rem;color:var(--text-muted);line-height:1.6">Pastikan kode referral kamu dibagikan. Downline yang daftar dengan kode kamu akan muncul di halaman Referral & Clients.</p>' +
          '<a href="referral.html" class="btn-primary" style="display:inline-flex;margin-top:1rem;width:auto;padding:.65rem 1.2rem;text-decoration:none">Lihat Network →</a>' +
        '</div></div>';
  }, 400);
}
</script>
</body>
</html>
