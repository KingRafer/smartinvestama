<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#060b14"/>
<title>Dashboard — Smart AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/app.css?v=20261119v2">
<script>try{var t=localStorage.getItem('smartai_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<script src="../js/auth.js?v=20261119v2"></script>
<script src="../js/app.js?v=20261119v2"></script>
<script src="../js/mt5-api-v2.js"></script>
<script>
const user = renderShell('dashboard');
if (user) {
  var root = document.getElementById('page-content');
  root.innerHTML = '<div style="padding:2rem;text-align:center;color:var(--text-muted)">Memuat dashboard…</div>';
  function copyText(text, btn) {
    function ok() { var old = btn.textContent; btn.textContent = 'Tersalin ✓'; setTimeout(function () { btn.textContent = old; }, 1600); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok).catch(function(){});
    else ok();
  }
  function greeting() { var h = new Date().getHours(); if (h < 11) return 'Selamat pagi'; if (h < 15) return 'Selamat siang'; if (h < 18) return 'Selamat sore'; return 'Selamat malam'; }
  async function loadDash() {
    var accounts = [];
    try {
      if (typeof SmartAIMT5 !== 'undefined' && SmartAIMT5.getAccounts) {
        accounts = await SmartAIMT5.getAccounts(true);
        if ((!accounts || !accounts.length)) {
          await new Promise(function(r){ setTimeout(r, 600); });
          accounts = await SmartAIMT5.getAccounts(true);
        }
      }
    } catch (e) { accounts = []; }
    accounts = accounts || [];
    accounts.sort(function (a, b) { return String(a.account_id || '').localeCompare(String(b.account_id || '')); });
    var live = (typeof SmartAIMT5 !== 'undefined' && SmartAIMT5.isLive) ? SmartAIMT5.isLive() : false;
    var totalEq = 0, totalDaily = 0, totalProfit = 0, totalWd = 0, onlineN = 0;
    accounts.forEach(function (a) {
      if (Number.isFinite(Number(a.equity))) totalEq += Number(a.equity);
      var _d = Number(a.daily_profit);
      if (Number.isFinite(_d) && Math.abs(_d) < 500000) totalDaily += _d;
      if (Number.isFinite(Number(a.total_profit))) totalProfit += Number(a.total_profit);
      if (Number.isFinite(Number(a.total_penarikan))) totalWd += Number(a.total_penarikan);
      var st = String(a.status || '').toUpperCase();
      if (st === 'ONLINE' || st === 'DEMO' || st === 'LIVE') onlineN++;
    });
    var refCode = (user.referral && String(user.referral).trim()) ? String(user.referral).trim().toUpperCase() : 'SMARTAI-REF';
    var refLink = location.origin + location.pathname.replace(/\/member\/.*$/, '/') + 'daftar.html?ref=' + encodeURIComponent(refCode);
    var pkgName = { ACC01: 'Smart Basic', ACC02: 'Smart Gold', ACC03: 'Smart Pro' };
    var fmt = (typeof SmartAIMT5 !== 'undefined' && SmartAIMT5.formatUSD) ? SmartAIMT5.formatUSD : function (n) {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 2 }).format(n || 0);
    };
    var firstName = String(user.nama || 'Member').trim().split(/\s+/)[0];
    var cards = accounts.map(function (a) {
      var on = /ONLINE|DEMO|LIVE/i.test(String(a.status || ''));
      var daily = Number(a.daily_profit);
      var dailyNeg = Number.isFinite(daily) && daily < 0;
      var sub = [];
      if (a.login) sub.push('Login ' + a.login);
      if (a.broker_label || a.broker) sub.push(a.broker_label || a.broker);
      return '<div style="border:1px solid var(--border);border-radius:16px;padding:1.1rem;background:var(--bg-card-solid)">' +
        '<div style="display:flex;justify-content:space-between;margin-bottom:.5rem">' +
          '<span style="font-size:.7rem;font-weight:800;color:var(--cyan)">' + escapeHtml(pkgName[a.account_id] || a.name || 'MT5') + '</span>' +
          '<span style="font-size:.65rem;font-weight:700;color:' + (on ? 'var(--green)' : 'var(--text-muted)') + '">' + escapeHtml(a.status || '—') + '</span></div>' +
        '<div style="font-size:1.15rem;font-weight:800">' + escapeHtml(a.account_id || '—') + '</div>' +
        '<div style="font-size:.72rem;color:var(--text-muted);margin:.25rem 0 .75rem">' + escapeHtml(sub.join(' · ') || 'Akun trading') + '</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem">' +
          '<div style="padding:.5rem;border-radius:10px;border:1px solid var(--border)"><div style="font-size:.62rem;color:var(--text-dim)">Balance</div><strong>' + fmt(a.balance) + '</strong></div>' +
          '<div style="padding:.5rem;border-radius:10px;border:1px solid var(--border)"><div style="font-size:.62rem;color:var(--text-dim)">Equity</div><strong>' + fmt(a.equity) + '</strong></div>' +
          '<div style="padding:.5rem;border-radius:10px;border:1px solid var(--border)"><div style="font-size:.62rem;color:var(--text-dim)">Profit</div><strong>' + fmt(a.total_profit) + '</strong></div>' +
          '<div style="padding:.5rem;border-radius:10px;border:1px solid var(--border)"><div style="font-size:.62rem;color:var(--text-dim)">Penarikan</div><strong>' + fmt(a.total_penarikan) + '</strong></div>' +
        '</div>' +
        '<div style="margin-top:.75rem;text-align:center;font-weight:800;color:' + (dailyNeg ? 'var(--red)' : 'var(--cyan)') + '">Daily ' + fmt(a.daily_profit) + '</div></div>';
    }).join('');
    if (!cards) cards = '<div style="padding:1.5rem;text-align:center;color:var(--text-muted);border:1px solid var(--border);border-radius:16px">Belum ada data akun MT5.</div>';
    root.innerHTML =
      '<div style="margin-bottom:1.25rem"><h1 style="margin:0;font-size:1.4rem">' + escapeHtml(greeting()) + ', ' + escapeHtml(firstName) + '</h1>' +
        '<p style="color:var(--text-muted);margin:.35rem 0 0">' + accounts.length + ' akun terhubung · ' + onlineN + ' online' + (live ? ' · <span style="color:var(--green)">Live</span>' : '') + '</p></div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1rem;margin-bottom:1.25rem">' +
        '<div style="background:var(--bg-card-solid);border:1px solid var(--border);border-radius:14px;padding:1rem"><div style="font-size:.7rem;color:var(--text-dim)">Total equity</div><div style="font-size:1.2rem;font-weight:800">' + fmt(totalEq) + '</div></div>' +
        '<div style="background:var(--bg-card-solid);border:1px solid var(--border);border-radius:14px;padding:1rem"><div style="font-size:.7rem;color:var(--text-dim)">Daily profit</div><div style="font-size:1.2rem;font-weight:800;color:' + (totalDaily>=0?'var(--green)':'var(--red)') + '">' + fmt(totalDaily) + '</div></div>' +
        '<div style="background:var(--bg-card-solid);border:1px solid var(--border);border-radius:14px;padding:1rem"><div style="font-size:.7rem;color:var(--text-dim)">Total profit</div><div style="font-size:1.2rem;font-weight:800;color:var(--green)">' + fmt(totalProfit) + '</div></div>' +
        '<div style="background:var(--bg-card-solid);border:1px solid var(--border);border-radius:14px;padding:1rem"><div style="font-size:.7rem;color:var(--text-dim)">Penarikan</div><div style="font-size:1.2rem;font-weight:800">' + fmt(totalWd) + '</div></div></div>' +
      '<h2 style="font-size:1rem;margin:0 0 .9rem">Akun MT5</h2>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem;margin-bottom:1.25rem">' + cards + '</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:1rem;border:1px solid var(--border);border-radius:14px;background:var(--bg-card-solid)">' +
        '<strong style="color:var(--cyan)">' + escapeHtml(refCode) + '</strong>' +
        '<button type="button" id="dash-copy-code" style="cursor:pointer;padding:.4rem .8rem;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text)">Salin kode</button>' +
        '<button type="button" id="dash-copy-link" style="cursor:pointer;padding:.4rem .8rem;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text)">Salin link</button>' +
        '<a href="referral.html" style="color:var(--cyan)">Network →</a></div>';
    var btnCode = document.getElementById('dash-copy-code');
    var btnLink = document.getElementById('dash-copy-link');
    if (btnCode) btnCode.onclick = function () { copyText(refCode, this); };
    if (btnLink) btnLink.onclick = function () { copyText(refLink, this); };
  }
  loadDash();
  setInterval(loadDash, 45000);
}
</script>
</body>
</html>
