<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#060b14"/>
<title>Dashboard — Smart AI</title>
<meta name="description" content="Dashboard member Smart AI: pantau equity, daily profit, dan performa akun MT5 secara real-time."/>
<meta name="robots" content="noindex, nofollow"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/app.css?v=20261118r">
<style>
.dash-hero{position:relative;overflow:hidden;border-radius:20px;padding:1.5rem 1.6rem;margin-bottom:1.25rem;border:1px solid var(--border);background:radial-gradient(ellipse 80% 120% at 100% -20%,rgba(45,212,191,.18),transparent 55%),radial-gradient(ellipse 60% 80% at -10% 110%,rgba(167,139,250,.12),transparent 50%),linear-gradient(145deg,var(--bg-card-solid),rgba(12,18,32,.95))}
.dash-hero-inner{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:1.25rem;align-items:center;justify-content:space-between}
.dash-hero h1{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;margin:0 0 .25rem}
.dash-hero .greet{font-size:.88rem;color:var(--text-muted);line-height:1.45;max-width:420px}
.dash-hero .greet strong{color:var(--text);font-weight:700}
.dash-hero-meta{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.35rem .7rem;border-radius:999px;font-size:.72rem;font-weight:700;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text-muted)}
.pill.live{border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.1);color:var(--green)}
.pill.live i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.2);animation:pulse 1.6s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.dash-ref{position:relative;overflow:hidden;border-radius:18px;padding:1.2rem 1.3rem;margin-bottom:1.25rem;border:1px solid rgba(45,212,191,.22);background:linear-gradient(135deg,rgba(45,212,191,.1),rgba(20,184,166,.04) 40%,transparent),var(--bg-card-solid);display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between}
.dash-ref .badge-ref{display:inline-flex;align-items:center;gap:.3rem;font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--cyan);margin-bottom:.3rem}
.dash-ref h3{font-size:1rem;font-weight:800;margin:0 0 .2rem}
.dash-ref .info p{font-size:.78rem;color:var(--text-muted);margin:0;max-width:280px}
.dash-ref .actions{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.dash-ref code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:800;color:var(--cyan);padding:.5rem .85rem;border-radius:10px;background:rgba(45,212,191,.12);border:1px solid rgba(45,212,191,.25);font-size:.9rem;letter-spacing:.04em}
.dash-ref .btn-copy,.dash-ref .btn-link{border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text);padding:.5rem .85rem;border-radius:10px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:.3rem}
.dash-ref .btn-copy:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(45,212,191,.08)}
.dash-ref .btn-link{color:var(--cyan);border-color:rgba(45,212,191,.3)}
.stats-grid.dash-stats{gap:1rem;margin-bottom:1.35rem}
.stat-card.dash-stat{position:relative;overflow:hidden;border-radius:16px;padding:1.15rem 1.2rem;background:var(--bg-card-solid);border:1px solid var(--border);transition:transform .2s,border-color .2s,box-shadow .2s}
.stat-card.dash-stat:hover{transform:translateY(-3px);border-color:rgba(45,212,191,.25);box-shadow:0 12px 28px var(--glow)}
.stat-card.dash-stat .ico{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:.75rem}
.stat-card.dash-stat .ico svg{width:18px;height:18px}
.stat-card.dash-stat .ico.eq{background:rgba(45,212,191,.12);color:var(--cyan)}
.stat-card.dash-stat .ico.dp{background:rgba(52,211,153,.12);color:var(--green)}
.stat-card.dash-stat .ico.tp{background:rgba(96,165,250,.12);color:var(--blue)}
.stat-card.dash-stat .ico.wd{background:rgba(251,191,36,.12);color:var(--gold)}
.stat-card.dash-stat .label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);margin-bottom:.2rem}
.stat-card.dash-stat .value{font-size:1.35rem;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.stat-card.dash-stat .value.up{color:var(--green)}
.stat-card.dash-stat .hint{font-size:.72rem;color:var(--text-muted);margin-top:.3rem}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.9rem;flex-wrap:wrap}
.sec-head h2{font-size:1rem;font-weight:800;margin:0}
.sec-head .sub{font-size:.75rem;color:var(--text-muted)}
.mt5-mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.35rem}
@media(max-width:960px){.mt5-mini-grid{grid-template-columns:1fr}}
.mt5-mini{position:relative;overflow:hidden;border-radius:18px;padding:1.2rem 1.2rem 1.1rem;background:var(--bg-card-solid);border:1px solid var(--border);transition:transform .2s,border-color .2s,box-shadow .25s}
.mt5-mini:hover{transform:translateY(-4px);border-color:rgba(45,212,191,.3);box-shadow:0 16px 36px -12px rgba(0,0,0,.5)}
.mt5-mini .glow-bar{position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--cyan),var(--teal))}
.mt5-mini.gold .glow-bar{background:linear-gradient(90deg,var(--gold),#fbbf24)}
.mt5-mini.pro .glow-bar{background:linear-gradient(90deg,#a78bfa,#818cf8)}
.mt5-mini .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.85rem;gap:.5rem}
.mt5-mini .pkg{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--cyan);display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .5rem;border-radius:6px;background:rgba(45,212,191,.1)}
.mt5-mini.gold .pkg{color:var(--gold);background:rgba(245,158,11,.12)}
.mt5-mini.pro .pkg{color:#a78bfa;background:rgba(167,139,250,.12)}
.mt5-mini .st{font-size:.62rem;font-weight:800;padding:.22rem .55rem;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.mt5-mini .st.on{background:rgba(34,197,94,.15);color:var(--green)}
.mt5-mini .st.off{background:rgba(148,163,184,.1);color:var(--text-muted)}
.mt5-mini .aid{font-size:1.2rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.15rem}
.mt5-mini .aid-sub{font-size:.72rem;color:var(--text-muted);margin-bottom:.85rem}
.mt5-mini .metrics{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.mt5-mini .metric{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:12px;padding:.55rem .65rem}
.mt5-mini .metric span{display:block;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);margin-bottom:.15rem}
.mt5-mini .metric strong{font-size:.88rem;font-weight:800;color:var(--text)}
.mt5-mini .dp{margin-top:.85rem;padding:.55rem .7rem;border-radius:12px;text-align:center;font-size:.82rem;font-weight:800;background:linear-gradient(135deg,rgba(45,212,191,.12),rgba(45,212,191,.04));border:1px solid rgba(45,212,191,.18);color:var(--cyan)}
.mt5-mini .dp.neg{color:var(--red);background:linear-gradient(135deg,rgba(248,113,113,.12),rgba(248,113,113,.04));border-color:rgba(248,113,113,.2)}
.dash-bottom{display:grid;grid-template-columns:1.1fr .9fr;gap:1.15rem}
@media(max-width:900px){.dash-bottom{grid-template-columns:1fr}}
.panel.dash-panel{border-radius:16px;overflow:hidden}
.profile-row{display:flex;align-items:center;gap:.85rem;padding:.9rem 0 1rem;border-bottom:1px solid var(--border);margin-bottom:.25rem}
.profile-row .av{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;color:#042f2e;background:linear-gradient(135deg,var(--cyan),var(--teal));flex-shrink:0}
.profile-row .nm{font-weight:800;font-size:.95rem}
.profile-row .em{font-size:.75rem;color:var(--text-muted)}
.kv-table td{padding:.55rem 0;border-bottom:1px solid var(--border);font-size:.85rem}
.kv-table tr:last-child td{border-bottom:none}
.kv-table td:first-child{color:var(--text-muted);width:38%}
.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.quick-actions a{display:flex;align-items:center;gap:.5rem;padding:.7rem .8rem;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.02);color:var(--text);font-size:.8rem;font-weight:600;text-decoration:none;transition:border-color .15s,background .15s,transform .15s}
.quick-actions a:hover{border-color:rgba(45,212,191,.35);background:rgba(45,212,191,.06);transform:translateY(-1px);text-decoration:none;color:var(--cyan)}
.quick-actions a svg{width:16px;height:16px;opacity:.7;flex-shrink:0}
.page-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:280px;gap:.9rem;color:var(--text-muted)}
.page-loading .spin{width:40px;height:40px;border-radius:50%;border:3px solid rgba(45,212,191,.12);border-top-color:var(--cyan);animation:dashSpin .65s linear infinite}
@keyframes dashSpin{to{transform:rotate(360deg)}}
.page-loading p{font-size:.85rem;margin:0}
</style>
<script>try{var t=localStorage.getItem('smartai_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<script src="../js/auth.js?v=20261118r"></script>
<script src="../js/app.js?v=20261118r"></script>
<script src="../js/mt5-api.js?v=20261118r"></script>
<script>
const user = renderShell('dashboard');
if (user) {
  var root = document.getElementById('page-content');
  root.innerHTML = '<div class="page-loading"><div class="spin" aria-hidden="true"></div><p>Memuat dashboard…</p></div>';
  function copyText(text, btn) {
    function ok() { var old = btn.textContent; btn.textContent = 'Tersalin ✓'; setTimeout(function () { btn.textContent = old; }, 1600); }
    function fallback() { var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) {} document.body.removeChild(ta); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok).catch(fallback);
    else fallback();
  }
  function greeting() { var h = new Date().getHours(); if (h < 11) return 'Selamat pagi'; if (h < 15) return 'Selamat siang'; if (h < 18) return 'Selamat sore'; return 'Selamat malam'; }
  function ico(path) { return '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="' + path + '"/></svg>'; }
  async function loadDash() {
    var accounts = [];
    try { if (typeof SmartAIMT5 !== 'undefined' && SmartAIMT5.getAccounts) accounts = await SmartAIMT5.getAccounts(true); } catch (e) { accounts = []; }
    accounts = accounts || [];
    accounts.sort(function (a, b) { return String(a.account_id || '').localeCompare(String(b.account_id || '')); });
    var live = (typeof SmartAIMT5 !== 'undefined' && SmartAIMT5.isLive) ? SmartAIMT5.isLive() : false;
    var totalEq = 0, totalDaily = 0, totalProfit = 0, totalWd = 0, onlineN = 0;
    accounts.forEach(function (a) {
      if (Number.isFinite(Number(a.equity))) totalEq += Number(a.equity);
      if (Number.isFinite(Number(a.daily_profit))) totalDaily += Number(a.daily_profit);
      if (Number.isFinite(Number(a.total_profit))) totalProfit += Number(a.total_profit);
      if (Number.isFinite(Number(a.total_penarikan))) totalWd += Number(a.total_penarikan);
      if (String(a.status || '').toUpperCase() === 'ONLINE') onlineN++;
    });
    var refCode = (user.referral && String(user.referral).trim()) ? String(user.referral).trim().toUpperCase() : 'SMARTAI-REF';
    var refLink = location.origin + location.pathname.replace(/[^/]+$/, '') + 'daftar.html?ref=' + encodeURIComponent(refCode);
    var pkgClass = { ACC01: 'basic', ACC02: 'gold', ACC03: 'pro' };
    var pkgName = { ACC01: 'Smart Basic', ACC02: 'Smart Gold', ACC03: 'Smart Pro' };
    var fmt = (typeof SmartAIMT5 !== 'undefined' && SmartAIMT5.formatUSD) ? SmartAIMT5.formatUSD : function (n) { return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 2 }).format(n || 0); };
    var esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };
    var firstName = String(user.nama || 'Member').trim().split(/\s+/)[0];
    var cards = accounts.map(function (a) {
      var cls = pkgClass[a.account_id] || 'basic';
      var on = String(a.status || '').toUpperCase() === 'ONLINE';
      var daily = Number(a.daily_profit);
      var dailyNeg = Number.isFinite(daily) && daily < 0;
      var sub = [];
      if (a.login) sub.push('Login ' + a.login);
      if (a.owner) sub.push(a.owner);
      if (a.broker_label || a.broker) sub.push(a.broker_label || a.broker);
      var html = '<div class="mt5-mini ' + cls + '"><div class="glow-bar"></div>';
      html += '<div class="top"><span class="pkg">' + esc(pkgName[a.account_id] || a.name || 'MT5') + '</span>';
      html += '<span class="st ' + (on ? 'on' : 'off') + '">' + esc(a.status || '—') + '</span></div>';
      html += '<div class="aid">' + esc(a.account_id || '—') + '</div>';
      html += '<div class="aid-sub">' + esc(sub.join(' · ') || 'Akun trading') + '</div>';
      html += '<div class="metrics">';
      html += '<div class="metric"><span>Balance</span><strong>' + fmt(a.balance) + '</strong></div>';
      html += '<div class="metric"><span>Equity</span><strong>' + fmt(a.equity) + '</strong></div>';
      html += '<div class="metric"><span>Profit</span><strong>' + fmt(a.total_profit) + '</strong></div>';
      html += '<div class="metric"><span>Penarikan</span><strong>' + fmt(a.total_penarikan) + '</strong></div>';
      html += '</div>';
      html += '<div class="dp' + (dailyNeg ? ' neg' : '') + '">Daily ' + fmt(a.daily_profit) + '</div></div>';
      return html;
    }).join('');
    if (!cards) cards = '<div class="panel" style="grid-column:1/-1;padding:1.5rem;text-align:center;color:var(--text-muted);border-radius:16px">Belum ada data akun MT5.</div>';
    var qa = [
      { href: 'performance.html', label: 'Performance', d: 'M13 7h8m0 0v8m0-8l-8 8-4-4-6 6' },
      { href: 'trading-report.html', label: 'Trading Report', d: 'M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z' },
      { href: 'commission.html', label: 'Commission', d: 'M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z' },
      { href: 'referral.html', label: 'Referral', d: 'M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1' },
      { href: 'transactions.html', label: 'Transactions', d: 'M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4' },
      { href: 'profile.html', label: 'My Profile', d: 'M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z' }
    ].map(function (q) { return '<a href="' + q.href + '">' + ico(q.d) + escapeHtml(q.label) + '</a>'; }).join('');
    root.innerHTML =
      '<div class="dash-hero"><div class="dash-hero-inner">' +
        '<div><h1>' + escapeHtml(greeting()) + ', ' + escapeHtml(firstName) + '</h1>' +
          '<p class="greet">Ringkasan trading & jaringan referral kamu. <strong>' + accounts.length + ' akun</strong> terhubung · ' + onlineN + ' online.</p></div>' +
        '<div class="dash-hero-meta">' + (live ? '<span class="pill live"><i></i> Live data</span>' : '<span class="pill">MT5</span>') +
          '<span class="pill">' + escapeHtml(typeof formatToday === 'function' ? formatToday() : new Date().toLocaleDateString('id-ID')) + '</span></div></div></div>' +
      '<div class="dash-ref"><div class="info"><div class="badge-ref">✦ Referral</div><h3>Ajak member, bangun network</h3><p>Bagikan kode atau link — downline otomatis masuk di bawah kamu.</p></div>' +
        '<div class="actions"><code id="dash-ref-code">' + escapeHtml(refCode) + '</code>' +
          '<button type="button" class="btn-copy" id="dash-copy-code">Salin kode</button>' +
          '<button type="button" class="btn-copy" id="dash-copy-link">Salin link</button>' +
          '<a class="btn-link" href="referral.html">Network →</a></div></div>' +
      '<div class="stats-grid dash-stats">' +
        '<div class="stat-card dash-stat"><div class="ico eq">' + ico('M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z') + '</div><div class="label">Total equity</div><div class="value">' + fmt(totalEq) + '</div><div class="hint">' + accounts.length + ' akun · ' + onlineN + ' online</div></div>' +
        '<div class="stat-card dash-stat"><div class="ico dp">' + ico('M13 7h8m0 0v8m0-8l-8 8-4-4-6 6') + '</div><div class="label">Daily profit</div><div class="value ' + (totalDaily >= 0 ? 'up' : '') + '">' + fmt(totalDaily) + '</div><div class="hint">Semua akun · hari ini</div></div>' +
        '<div class="stat-card dash-stat"><div class="ico tp">' + ico('M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z') + '</div><div class="label">Total profit</div><div class="value up">' + fmt(totalProfit) + '</div><div class="hint">Kumulatif</div></div>' +
        '<div class="stat-card dash-stat"><div class="ico wd">' + ico('M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z') + '</div><div class="label">Total penarikan</div><div class="value">' + fmt(totalWd) + '</div><div class="hint">Semua akun</div></div></div>' +
      '<div class="sec-head"><h2>Akun MT5</h2><span class="sub">Balance · equity · profit</span></div>' +
      '<div class="mt5-mini-grid">' + cards + '</div>' +
      '<div class="dash-bottom">' +
        '<div class="panel dash-panel"><div class="panel-head"><h2>Profil member</h2><span class="sub">Akun kamu</span></div>' +
          '<div class="profile-row"><div class="av">' + escapeHtml((user.nama || 'SA').split(/\s+/).map(function(p){return p[0];}).join('').slice(0,2).toUpperCase()) + '</div>' +
            '<div><div class="nm">' + escapeHtml(user.nama || 'Member') + '</div><div class="em">' + escapeHtml(user.email || '') + '</div></div></div>' +
          '<table class="kv-table"><tbody>' +
            '<tr><td>WhatsApp</td><td>' + escapeHtml(user.hp || '—') + '</td></tr>' +
            '<tr><td>Kode referral</td><td><strong style="color:var(--cyan)">' + escapeHtml(refCode) + '</strong></td></tr>' +
            '<tr><td>Status</td><td><span class="badge ok">Active</span></td></tr></tbody></table></div>' +
        '<div class="panel dash-panel"><div class="panel-head"><h2>Quick access</h2><span class="sub">Pintasan</span></div><div class="quick-actions">' + qa + '</div></div></div>';
    var btnCode = document.getElementById('dash-copy-code');
    var btnLink = document.getElementById('dash-copy-link');
    if (btnCode) btnCode.onclick = function () { copyText(refCode, this); };
    if (btnLink) btnLink.onclick = function () { copyText(refLink, this); };
  }
  loadDash();
  setInterval(loadDash, 45000);
}
</script>
</body>
</html>
