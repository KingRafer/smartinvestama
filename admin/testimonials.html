<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testimoni — Smart AI Admin</title>
  <meta name="theme-color" content="#070b14">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin.css">
  <script src="../js/theme-init.js"></script>
  <script src="../js/guard.js"></script>
  <style>
    .mod-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem 1.2rem; margin-bottom: .85rem; }
    .mod-card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: .5rem; }
    .mod-card .name { font-weight: 700; }
    .mod-card .meta { font-size: .78rem; color: var(--text-muted); }
    .mod-card .stars { color: var(--gold); letter-spacing: 1px; }
    .mod-card .comment { font-size: .92rem; color: var(--text); margin: .5rem 0 .8rem; line-height: 1.5; }
    .mod-actions { display: flex; gap: .5rem; flex-wrap: wrap; }
    .btn-approve { background: rgba(52,211,153,.12); color: var(--green); border: 1px solid rgba(52,211,153,.3); padding: .4rem .85rem; border-radius: 8px; font-weight: 600; font-size: .8rem; cursor: pointer; }
    .btn-reject { background: rgba(248,113,113,.1); color: var(--red); border: 1px solid rgba(248,113,113,.25); padding: .4rem .85rem; border-radius: 8px; font-weight: 600; font-size: .8rem; cursor: pointer; }
    .status-pill { font-size: .68rem; font-weight: 700; padding: .2rem .5rem; border-radius: 999px; }
    .status-pending { background: rgba(251,191,36,.12); color: var(--gold); }
    .status-approved { background: rgba(52,211,153,.12); color: var(--green); }
    .status-rejected { background: rgba(248,113,113,.12); color: var(--red); }
    .empty { text-align: center; padding: 2.5rem; color: var(--text-muted); }
    .tabs { display: flex; gap: .5rem; margin-bottom: 1.25rem; }
    .tab { padding: .45rem 1rem; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); font-size: .85rem; font-weight: 600; cursor: pointer; }
    .tab.active { background: rgba(45,212,191,.12); color: var(--cyan); border-color: rgba(45,212,191,.3); }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark">⚡</span>
        <div><strong>SMART<span>AI</span></strong><small>Admin Panel</small></div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">Overview</div>
        <a class="nav-item" href="dashboard.html">Dashboard</a>
        <a class="nav-item" href="activity.html">Activity Log</a>
        <div class="nav-section">Manajemen</div>
        <a class="nav-item" href="members.html">Members</a>
        <a class="nav-item" href="accounts.html">Trading Accounts</a>
        <a class="nav-item" href="referrals.html">Referrals</a>
        <a class="nav-item" href="commissions.html">Commissions</a>
        <a class="nav-item active" href="testimonials.html">Testimoni</a>
        <div class="nav-section">Sistem</div>
        <a class="nav-item" href="settings.html">Settings</a>
      </nav>
      <div class="sidebar-foot">
        <button type="button" class="nav-item" data-logout>Logout</button>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="backdrop"></div>
    <div class="main-wrap">
      <header class="topbar">
        <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Menu">☰</button>
        <div class="topbar-title">Moderasi Testimoni</div>
        <div class="topbar-actions">
          <a class="btn-ghost-sm" href="../index.html" target="_blank">Landing</a>
        </div>
      </header>
      <main class="page-content" style="padding: 1.5rem;">
        <div class="tabs">
          <button class="tab active" data-filter="pending">Pending</button>
          <button class="tab" data-filter="approved">Approved</button>
          <button class="tab" data-filter="rejected">Rejected</button>
          <button class="tab" data-filter="all">Semua</button>
        </div>
        <div id="mod-list"></div>
      </main>
    </div>
  </div>
  <script src="../js/icons.js"></script>
  <script src="../js/admin.js"></script>
  <script>
  (function() {
    const KEY = 'smartai_testimonials';
    function getList() {
      try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) { return []; }
    }
    function save(list) { localStorage.setItem(KEY, JSON.stringify(list)); }

    let filter = 'pending';
    document.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        filter = t.dataset.filter;
        render();
      });
    });

    function stars(n) {
      let s = '';
      for (let i = 1; i <= 5; i++) s += i <= n ? '★' : '☆';
      return s;
    }

    function render() {
      const list = getList();
      const filtered = filter === 'all' ? list : list.filter(c => c.status === filter);
      const box = document.getElementById('mod-list');
      if (!filtered.length) {
        box.innerHTML = '<div class="empty">Tidak ada data untuk filter ini.</div>';
        return;
      }
      box.innerHTML = filtered.slice().reverse().map(c => `
        <div class="mod-card">
          <div class="top">
            <div>
              <div class="name">${esc(c.name)} ${c.package ? '· ' + esc(c.package) : ''}</div>
              <div class="meta">${esc(c.userId || '')} · ${esc(c.createdAt || '')}</div>
            </div>
            <span class="status-pill status-${c.status}">${c.status}</span>
          </div>
          <div class="stars">${stars(c.rating)}</div>
          <div class="comment">"${esc(c.comment)}"</div>
          <div class="mod-actions">
            ${c.status !== 'approved' ? `<button class="btn-approve" data-id="${c.id}" data-act="approved">Approve</button>` : ''}
            ${c.status !== 'rejected' ? `<button class="btn-reject" data-id="${c.id}" data-act="rejected">Reject</button>` : ''}
          </div>
        </div>
      `).join('');

      box.querySelectorAll('[data-act]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          const act = btn.dataset.act;
          const list = getList();
          const item = list.find(x => x.id === id);
          if (item) { item.status = act; save(list); render(); }
        });
      });
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    render();
  })();
  </script>
</body>
</html>
